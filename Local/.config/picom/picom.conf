# ==============================================================================
#          PICOM SIÊU TỐI GIẢN - TỐI ƯU HIỆU NĂNG & CHỐNG XÉ HÌNH
# ==============================================================================

# --- BACKEND LOGIC ---
# Đẩy toàn bộ tác vụ render và Vsync sang GPU Intel xử lý qua OpenGL
backend = "glx";
vsync = true;

# --- CHỐNG RÁC ĐỒ HỌA & VIỀN LẠ ---
# Tắt triệt để bóng đổ, hiệu ứng chuyển động và bo góc
shadow = false;
fading = false;
corner-radius = 0;

# Ép toàn bộ cửa sổ (cả active và inactive) luôn đặc 100%, không mờ đục
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# --- ĐIỀU KHOẢN LOẠI TRỪ TUYỆT ĐỐI (RULES) ---
# Ngăn chặn picom cố tình vẽ bóng hoặc can thiệp vào viền cửa sổ của Window Manager
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- TỐI ƯU HÓA PHẦN CỨNG (GLX) ---
# Tách biệt luồng xử lý X11 và OpenGL để tránh lag trễ hình ảnh
xrender-sync-fence = true;

# Không vẽ lại các cửa sổ đã bị che khuất để tiết kiệm tài nguyên GPU
unredir-if-possible = true;

# Cho phép phát hiện chính xác tần số quét của màn hình để đồng bộ Vsync
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# --- QUẢN LÝ TIẾN TRÌNH ---
# Định danh log và chế độ chạy ngầm
log-level = "warn";
